name: Feature Request
description: Suggest a new feature
title: "[FEAT] "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: "Thanks for suggesting a feature! Please describe what you'd like to see."
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - stellar-pay-core
        - stellar-pay-api
        - stellar-pay-frontend
        - stellar-pay-analytics
        - root / cross-package
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds?
  - type: checkboxes
    id: wave
    attributes:
      label: Wave Issue
      description: Is this related to a planned Wave issue?
      options:
        - label: "Yes, this is a Wave issue"
        - label: "No, this is a new idea"