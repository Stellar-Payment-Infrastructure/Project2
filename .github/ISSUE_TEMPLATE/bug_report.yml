name: Bug Report
description: Report a bug
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting a bug! Please fill out the form below."
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - stellar-pay-core
        - stellar-pay-api
        - stellar-pay-frontend
        - stellar-pay-analytics
        - root / cross-package
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version/Commit
      description: Which version or commit are you using?
      placeholder: "e.g., core-v0.1.0 or commit abc123"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear description of the bug
      placeholder: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs/Error Output
      description: Paste any relevant logs or error messages
      render: shell